<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Lagerplatz-App</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" />

  <script src="https://unpkg.com/html5-qrcode"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>

<body>
  <header class="app-header">
    <div>
      <h1>Lagerplatz-App</h1>
      <p>Paletten einlagern, auslagern und suchen</p>
    </div>

    <button id="toggleDarkBtn" class="icon-btn" type="button">🌙</button>
  </header>

  <main class="app-shell">
    <nav class="mobile-nav">
      <button class="nav-btn active" data-view="einlagernView" type="button">📦 Einlagern</button>
      <button class="nav-btn" data-view="auslagernView" type="button">📤 Auslagern</button>
    </nav>

     <nav class="desktop-nav">
      <button class="nav-btn active" data-view="sucheView" type="button">🔍 Suche</button>
      <button class="nav-btn" data-view="vorbereitungView" type="button">
        🛠 Vorbereitung
        <span id="preparationCount"></span>
      </button>
      <button class="nav-btn" data-view="uebersichtView" type="button">📋 Übersicht</button>
      <button class="nav-btn" data-view="einlagernView" type="button">📦 Einlagern</button>
      <button class="nav-btn" data-view="auslagernView" type="button">📤 Auslagern</button>
    </nav>

    <section id="message" class="message"></section>

    <!-- EINLAGERN -->
    <section id="einlagernView" class="view active">
      <div class="card">
        <h2>Palette einlagern</h2>

        <label>
          Auftragsnummer
          <input id="auftragInput" type="text" inputmode="numeric" placeholder="z. B. 933841" />
        </label>

        <label>
          Positionsnummer
          <input id="positionInput" type="text" inputmode="numeric" placeholder="z. B. 1" />
        </label>

        <label>
          Palettennummer
          <input id="paletteInput" type="text" inputmode="numeric" placeholder="Barcode scannen oder eingeben" />
        </label>

        <div class="button-row">
          <button id="scanPaletteBtn" type="button">📷 Barcode scannen</button>
          <button id="stopScanBtn" class="secondary hidden" type="button">Scan stoppen</button>
        </div>

        <div id="scannerWrap" class="scanner hidden">
          <div id="scanner"></div>
        </div>

        <div class="grid-2">
          <label>
            Bereich
            <select id="bereichInput"></select>
          </label>

          <label>
            Platz von
            <select id="platzVonInput"></select>
          </label>
        </div>

        <label>
          Platz bis
          <select id="platzBisInput"></select>
        </label>

        <button id="savePaletteBtn" class="primary" type="button">Palette einlagern</button>
      </div>
    </section>

    <!-- AUSLAGERN -->
    <section id="auslagernView" class="view">
      <div class="card">
        <h2>Palette auslagern</h2>

        <div class="grid-2">
          <label>
            Bereich
            <select id="ausBereichInput"></select>
          </label>

          <label>
            Platz
            <select id="ausPlatzInput"></select>
          </label>
        </div>

        <button id="findPlaceBtn" class="primary" type="button">Lagerplatz öffnen</button>

        <div id="auslagerInfo" class="result-box hidden"></div>

        <button id="removePaletteBtn" class="danger hidden" type="button">Palette auslagern</button>
      </div>
    </section>

    <!-- SUCHE -->
    <section id="sucheView" class="view desktop-default">
      <div class="card">
        <h2>Auftrag suchen</h2>

        <div class="grid-2">
          <label>
            Auftragsnummer
            <input id="searchAuftragInput" type="text" inputmode="numeric" placeholder="z. B. 933841" />
          </label>

          <label>
            Positionsnummer
            <input id="searchPositionInput" type="text" inputmode="numeric" placeholder="z. B. 1" />
          </label>
        </div>

        <button id="searchOrderBtn" class="primary" type="button">Suchen</button>

        <div id="searchResult" class="result-box hidden"></div>

<div id="searchPreparationControls" class="preparation-controls hidden">
  <label>
    Maschine
    <select id="searchMachineInput"></select>
  </label>

  <button id="addToPreparationBtn" class="primary" type="button">
    Ausgewählte zur Vorbereitung hinzufügen
  </button>
</div>
      </div>
    </section>

    <!-- ARBEITSVORBEREITUNG -->
<section id="vorbereitungView" class="view">
  <div class="card">
    <div class="preparation-header">
      <div>
        <h2>Arbeitsvorbereitung</h2>
        <p id="preparationSummary" class="muted-text">
          Noch keine Paletten ausgewählt.
        </p>
      </div>

      <label class="sort-label">
        Sortierung
        <select id="preparationSortInput">
          <option value="lagerweg">Nach Lagerweg</option>
          <option value="maschine">Nach Maschine</option>
          <option value="auftrag">Nach Auftrag</option>
        </select>
      </label>
    </div>

    <div id="preparationList" class="preparation-list">
      <div class="empty-state">
        Noch keine Paletten zur Vorbereitung hinzugefügt.
      </div>
    </div>

    <div class="preparation-actions">
      <button id="printPreparationBtn" type="button">
        🖨 Drucken
      </button>

      <button id="completePreparationBtn" class="danger" type="button">
        📤 Als ausgelagert markieren
      </button>

      <button id="clearPreparationBtn" class="secondary" type="button">
        🗑 Liste leeren
      </button>
    </div>
  </div>
</section>
    <!-- ÜBERSICHT -->
    <section id="uebersichtView" class="view">
      <div class="card">
        <h2>Lagerübersicht</h2>

        <input id="overviewFilterInput" type="text" placeholder="Filtern nach Auftrag, Palette, Bereich oder Platz" />

        <div id="overviewList" class="table-wrap"></div>
      </div>
    </section>
  </main>

  <<script src="firebase-config.js"></script>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/ui.js"></script>
<script src="js/firestore.js"></script>
<script src="js/scanner.js"></script>
<script src="js/warehouse.js"></script>
<script src="js/search.js"></script>
<script src="js/preparation.js"></script>

<script src="app.js"></script>
</body>
</html>
