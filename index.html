<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lagerverwaltung</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <meta name="theme-color" content="#1f2937" />
</head>
<body>
  <header class="app-header">
    <h1>Lagerverwaltung</h1>
    <p>Lagerverwaltung KWK-Verpackung Test</p>
  </header>

  <main>
    <section class="panel">
      <h2>Excel / Daten</h2>
      <input id="fileInput" type="file" accept=".xlsx,.xls" />
      <input id="jsonInput" type="file" accept=".json" style="display:none" />

      <div class="status-row">
        <span id="fileStatus">Firebase wird automatisch geladen</span>
      </div>

      <div class="button-row">
        <button id="downloadBtn" disabled>Excel herunterladen</button>
        <button id="loadJsonBtn">JSON laden</button>
        <button id="saveJsonBtn">JSON speichern</button>
        <button id="clearChangesBtn">Lokal zurücksetzen</button>
      </div>
    </section>

    <section class="panel sticky-panel">
      <h2>Ausgewählter Lagerplatz</h2>

      <div class="selected-box">
        <div><strong>Platz:</strong> <span id="selectedSlot">-</span></div>
        <div><strong>Zelle:</strong> <span id="selectedCell">-</span></div>
        <div><strong>Aktueller Inhalt:</strong> <span id="currentValue">-</span></div>
      </div>

      <label for="orderInput">Auftragsnummer</label>
      <input id="orderInput" type="text" placeholder="Scannen oder manuell eingeben" autocomplete="off" />

      <div class="button-row">
        <button id="ocrBtn" disabled>Auftragsschein scannen</button>        
        <button id="scanBtn" disabled>Kamera scannen</button>
        <button id="saveBtn" disabled>Speichern</button>
        <button id="emptyBtn" disabled>Platz leeren</button>
      </div>
      <input id="ocrImageInput" type="file" accept="image/*" capture="environment" style="display:none" />
      <div id="scannerWrap" class="scanner hidden">
        <div id="reader"></div>
        <button id="stopScanBtn">Scan beenden</button>
      </div>

      <p id="message" class="message"></p>
    </section>

    <section class="legend">
      <span><span class="dot free"></span> frei</span>
      <span><span class="dot occupied"></span> belegt</span>
      <span><span class="dot selected"></span> ausgewählt</span>
      <span><span class="dot changed"></span> geändert</span>
    </section>

    <section class="panel mobile-tools">
      <h2>Werkzeuge</h2>

      <div id="statsBox" class="stats-box"></div>

      <label for="searchInput">Auftrag oder Lagerplatz suchen</label>
      <input id="searchInput" type="text" placeholder="z. B. 4711 oder R3.2.15" />

      <div class="button-row">
        <button id="searchBtn">Suchen</button>
        <button id="findFreeBtn">Nächsten freien Platz</button>
      </div>

      <label for="outInput">Auslagern / Auftrag finden</label>
      <input id="outInput" type="text" placeholder="Auftragsnummer scannen/eingeben" />

      <div class="button-row">
        <button id="outSearchBtn">Auftrag finden</button>
        <button id="outClearBtn">Gefundenen Platz leeren</button>
      </div>

      <div class="button-row">
        <button id="toggleDarkBtn">🌙 Dunkelmodus</button>
      </div>
    </section>

    <section id="warehouse" class="warehouse"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <script src="mapping.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
